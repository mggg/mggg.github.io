sections:
  - type: callout
    toc: Introduction
    pullquote: Big things are happening!
    show_subscribe: true
    body: |
      The outfit formerly known as MGGG (aka the Metric Geometry and Gerrymandering Group) is entering a new chapter as the **Data and Democracy Research Initiative (DDRI)** in our new home at the University of Chicago.  DDRI is a big tent that supports projects on democracy, governance, and data.  Our lab (now the Data and Democracy Lab) will anchor the initiative.

      To help everyone stay updated, we're excited to launch a twice-per-year DDRI newsletter where you can keep up with our research and software projects. Whether you're interested in new research directions, software releases, upcoming events, or general news from the lab, we'll compile all of it here for your convenience.
      
      We hope you'll stay engaged and connected with us as we continue to evolve!

  - type: research
    heading: Research Highlights
    collapsible: true
    open: false
    color: magenta
    items:
      - name: New papers
        description: Some recently published papers by members of the lab and collaborators include [reversible recombination](https://epubs.siam.org/doi/10.1137/24M166944X) in SIAM Review, [Models of random spanning trees](https://onlinelibrary.wiley.com/doi/10.1002/rsa.70063) in Random Structures & Algorithms, [weighted voting](https://data-democracy.org/AdaptiveBanz) in EC'26, and [a new polarization index](https://projecteuclid.org/journals/annals-of-applied-statistics/volume-20/issue-2/Measuring-public-opinion--The-Wasserstein-bipolarization-index-with-application/10.1214/26-AOAS2162.full) in Annals of Applied Statistics.
      - name: Current collaborative projects
        description: 'Some of our recent oddball ideas:  an "[autocomplete](https://data-democracy.org/autocomplete)" model of preference formation; a new segregation score that captures diffusion effects in American cities; and a new framework that looks at [*how badly*](https://data-democracy.org/GAA) voting rules fail various guarantees, not just how often.'
      - name: Student research
        description: Students in the lab have been pursuing cool projects on representation and spatiality, the geometry of voting rules, the "veto core" in social choice theory, the shape of the space of redistricting plans, and new topological characterizations of Arrow's impossibility.

  - type: outreach
    heading: Outreach
    collapsible: true
    color: yellow
    open: false
    items:
      - name: Election modeling team
        description: "During the summer, members of our election modeling team completed studies for a number of localities including Portland, Santa Clara, San Diego, and Chicago. The former utilized campaign finance and ballot data from Portland's first multi-member ranked-choice city council election to explore how fundraising relates to tracked ballot and common support between candidates. The latter three projects explore the possible impacts of changing election systems in each respective locality, with specific attention paid to Asian communities and their potential to achieve proportional representation in city elections."
        link:
          label: Explore more election system case studies
          url: https://data-democracy.org/election-system-case-studies

      - name: Partners and projects (MDP, Brennan, Unidos, Navajo Nation)
        description: TBD

  - type: software
    heading: Software Updates
    color: blue
    collapsible: true
    open: false
    items:
      - name: Districtr
        version: v2.0
        color: blue
        description: "Districtr, our public-facing package for drawing districts and communities, has recently gotten a huge overhaul on the frontend and backend. New features include:"
        features:
          - Updated election data through 2024 (in most locations)
          - Map coverage for all 50 states, DC, and Puerto Rico
          - A new "Super Draw" mode that lets you break precincts down to the block level to obtain legally accurate maps
          - Advanced evaluation tools available on every map -- and more to come!
          - A new Content Management System (CMS) that makes it easier for city officials and other partners to assemble a gallery of public feedback
        note: The [legacy version of Districtr](https://legacy.districtr.org/) will remain available as a read-only copy, so existing work can still be accessed.

      - name: VoteKit
        version: v3.5
        color: magenta
        description: 'We call VoteKit our "Swiss army knife for computational social choice research" -- that means you can use it to study electoral systems, from practical ones like ranked choice to far-fetched ones like OneShotMultiRandomDictator. The recent changes reflect user requests in the last few months, and more is on the way.'
        features:
          - More formats supported for candidate names
          - More support for reproducibility
          - Better forms of queries to find particular ballots of interest
          - New voting rules like SimultaneousVeto and SerialVeto
          - Animations for ranked choice elections (and more on the way!)
          - A user-friendly front end called [VoteKit Lite](https://votekitlite.netlify.app) gives access to some functionality for the Python-phobic
        link:
          label: See release documentation
          url: https://github.com/mggg/VoteKit/releases/tag/v3.5.0

      - name: GerryChain
        version: v1.0
        color: yellow
        description: "GerryChain was originally launched back in 2018 and has been in continuous development since then, but the releases are only just catching up! This package implements the recombination family of algorithms for making districting plans -- and a whole lot more. New highlights include:"
        features:
          - A new graph backend abstraction, no longer tied directly to `networkx.Graph`, increasing speed 2–3x
          - A cleaner, more composable ReCom/proposal API
          - Support for multi-member districts
          - Support for Python 3.11–3.14 and Pandas 3.0
          - Attention to backwards compatibility
        link:
          label: View migration guide
          url: https://gerrychain.readthedocs.io/en/v1.0.0/topics/v1p0p0_migration_guide/

      - name: GerryTools
        version: v2.0
        color: green
        description: 'GerryTools is a "sidecar" for GerryChain that supports plotting and mapping and other reporting features.'
        features:
          - Dramatically faster scoring of plans and ensembles (partly thanks to a Rust-backed scoring engine)
          - Improved interoperability with GerryChain
          - A new modular plotting API for histograms, boxplots, violin plots, seats-votes curves, maps, and more
          - Improved tools for comparing plans and publication-oriented LaTeX/TikZ output
          - Better tools for interacting with the Census API

      - name: RustReCom
        version: v0.2
        color: coral
        description: "RustReCom is our super fast implementation of recombination in Rust, a high performance language with good memory safety guarantees."
        features:
          - Unified command line tool for chains and heuristic optimization
          - Better customizability, such as for edge weights
          - Written for compatibility with BENDL, our bespoke highly compressed data format
    closing: Big shoutout to the team for all of their hard work on these new releases! Please feel free to send your feedback to [code@data-democracy.org](mailto:code@data-democracy.org) as we continue to improve these tools.
