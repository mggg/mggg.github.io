  - id: pasadena-tx
    name: Pasadena, Texas
    state: TX
    scope: local
    lat: 29.691
    lon: -95.209
    types: [city-council]
    description: Modeling for the City Council, which a federal court ordered back to eight single-member districts in a Voting Rights Act case over its 2014 switch to six districts and two at-large seats. Single transferable vote (STV) would typically elect 3 to 5 Latino-preferred members of eight, or 2 to 4 if Latino turnout stays low.
    studies:
      - title: Ranked Choice Voting and Minority Representation
        year: 2021
        url: /uploads/STV-POC.pdf

  - id: pennsylvania
    name: Pennsylvania
    state: PA
    scope: statewide
    types: [congressional]
    description: "Expert reports in two congressional redistricting cases decided by the state's courts: in *LWV v. Commonwealth*, an outlier analysis finding the legislative leaders' 2018 plan an extreme partisan outlier, and in *Carter v. Chapman*, an analysis of how to understand a plan's partisan properties."
    studies:
      - title: Outlier analysis for Pennsylvania (LWV v. Commonwealth)
        year: 2018
        url: /publications/md-report.pdf
      - title: Pennsylvania congressional (Carter v. Chapman)
        year: 2022
