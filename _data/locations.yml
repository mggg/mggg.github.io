    lon: -122.679
    types: [city-council]
    description: Studies before and after Portland adopted single transferable vote (STV) for its City Council, from comparing system options, to modeling likely outcomes, to analyzing the first STV election in 2024 and how campaign fundraising compared with ballot support in it.
