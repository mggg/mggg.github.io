    name: San Diego, California
    state: CA
    scope: local
    lat: 32.716
    lon: -117.161
    types: [city-council]
    description: Simulations of how alternative election systems would perform for the San Diego City Council, with attention to Asian voters, about a fifth of the voting-age population, who remain underrepresented in city government.
    studies:
      - title: San Diego City Council Election Analysis
        year: 2026
        url: https://mggg.github.io/San-Diego-Election-Analysis/

