{% comment %} Logo and mobile menu button, shared by top_navigation.html and personal_navigation.html. {% endcomment %}
<div class="site-nav__logo">
  <a href="/">
    <img
      class="site-nav__logo__img"
      src="/assets/reynolds_redesign/DDL_UChicago_Color_RGB.svg"
      alt="Data and Democracy Lab"
    />
  </a>
  <script>
    function openNav() {
      var links = document.getElementById("nav-links");
      var button = document.querySelector('[aria-controls="nav-links"]');
      var isOpen = links.classList.toggle("site-nav__contents--show");
      button.setAttribute("aria-expanded", isOpen);
    }
  </script>
  <button
    class="site-nav__open-btn"
    aria-controls="nav-links"
    aria-expanded="false"
    onclick="openNav();"
  >
    <img src="/assets/baseline-menu-24px.svg" class="icon" alt="Menu" />
  </button>
</div>
