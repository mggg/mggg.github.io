# Place-based electoral studies, shown on the Locations page (/locations).
# Rendered by _includes/locations.html.
#
# `types` defines the governing-body categories: the badges on each card and
# the map legend / filter. `color` is used for map pins, shaded states, and
# legend swatches.
#
# Each entry in `locations`:
#   id           unique anchor id (lowercase, hyphens)
#   name         card title
#   state        two-letter postal code (used for the map and card header)
#   scope        statewide - the state is shaded on the map
#                local     - a pin is placed at `lat`/`lon`
#   lat, lon     pin position, decimal degrees (local only)
#   types        one or more `types` keys; the first sets the map color
#   image        optional header image; defaults to a locator map of the state
#   description  (markdown) one or two sentences on the work there
#   studies      list of { title, year (optional), url }; link to the page that
#                presents the study, or to the PDF if there's no such page
#
# Cards are sorted by name, so entries can be added anywhere.

types:
  - key: city-council
    label: City Council
    color: "#0072b2"
  - key: school-board
    label: School Board
    color: "#e69f00"
  - key: county
    label: County Government
    color: "#009e73"
  - key: state-legislature
    label: State Legislature
    color: "#882255"
  - key: congressional
    label: Congressional
    color: "#d55e00"
  - key: redistricting
    label: Redistricting
    color: "#56b4e9"

locations:
  - id: alabama
    name: Alabama
    state: AL
    scope: statewide
    types: [congressional]
    description: Expert analysis in *Allen v. Milligan*, a Voting Rights Act case arguing that Alabama's congressional plan diluted the votes of Black Alabamians, who make up about 2/7 of the state but had only one opportunity district out of seven.
    studies:
      - title: Alabama congressional (Allen v. Milligan)
        year: 2021
        url: /posts/alabama-1-expert-report

  - id: alaska
    name: Alaska
    state: AK
    scope: statewide
    types: [state-legislature]
    description: A study of Alaska's rule that state Senate districts pair adjacent House districts, enumerating every possible pairing to evaluate the expected partisan behavior of the resulting Senate plans.
    studies:
      - title: "Mathematics of Nested Districts: The Case of Alaska"
        year: 2019
        url: /alaska

  - id: arizona
    name: Arizona
    state: AZ
    scope: statewide
    types: [redistricting]
    description: Experiments showing that differential privacy in Census data would not prevent Arizona from enforcing the Voting Rights Act or upholding traditional redistricting principles.
    studies:
