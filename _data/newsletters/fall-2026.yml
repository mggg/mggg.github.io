# Fall 2026 newsletter. Rendered by _layouts/newsletter.html.
#
# Fields marked (markdown) accept Markdown/inline HTML. Any `link` with an
# empty `url` is not rendered, so placeholders can be left blank until ready.
#
# `sections` render in order. Supported `type`s:
#   callout  - tinted block with a pull quote, body text, and optional subscribe button
#   software - list of software releases; each item is an accordion showing only
#              its version and name until expanded (set `open: true` on an item
#              to start it expanded)
#   events   - talks/events; each sets a `format` (in-person | hybrid | remote)
#              that colors its badge and card
#   jobs     - job postings
#   research - papers and projects; each item has a name, description, and link
#   outreach - partnerships and community work; items work like research items
# Every non-callout section also accepts:
#   heading, tinted (bool), collapsible (bool), open (bool), closing (markdown), link,
#   color - accent for the heading bar, bullets, and event stripes; one of
#           blue | yellow | green | lime | magenta | purple | coral
#           (defined in _sass/components/_newsletter.scss)
# Software items also accept `color`, which tints their version badge and bullets.
# Any section may set:
#   toc - label in the table of contents (defaults to `heading`; sections with
#         neither are left out, so a callout only appears if it sets `toc`)
#   id  - anchor id (defaults to the slugified heading/toc)
#
# `header.image` is an optional image shown below the header, scaled to fit
# (up to 25rem tall, 10rem on phones); set `header.image_alt` too.
#
# Each issue also needs a page in newsletters/ (see newsletters/fall-2026.md).
# /newsletter shows whichever issue has the latest `date`.

