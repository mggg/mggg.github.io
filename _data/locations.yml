  - id: santa-clara-ca
    name: Santa Clara, California
    state: CA
    scope: local
    lat: 37.354
    lon: -121.955
    types: [city-council]
    description: An analysis of geography, demographics, and voting patterns comparing systems for electing the Santa Clara City Council in a California Voting Rights Act case, finding the standard six-district remedy and the city's proposed 2 × 3 plan inadequate and recommending at-large or custom transferable-vote systems, and a 2026 follow-up simulating alternative systems with a focus on proportional representation for the East Asian community.
    studies:
      - title: Study of voting systems for Santa Clara, CA
        year: 2018
        url: /publications/SantaClara.pdf
      - title: Santa Clara Alternative Election Analysis
        year: 2026
