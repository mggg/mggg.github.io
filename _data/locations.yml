    description: Expert analysis in *LULAC v. Abbott*, which challenges Texas's post-Census congressional plan and its more aggressively partisan replacement, with a report delineating race-versus-party distinctions; and modeling of the Fair Representation Act, which projects voters of color would elect 16 to 21 of Texas's 38 representatives of choice under ranked choice from multi-member districts, compared with 12 today.
    studies:
